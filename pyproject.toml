[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-moments"
version = "0.1.0"
description = "Find high-engagement moments in Twitch and YouTube streams/VODs."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
vision = ["open-clip-torch>=2.24", "Pillow>=10", "torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=8.0"]

[project.scripts]
stream-moments = "stream_moments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
